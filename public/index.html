<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scooter Live 3D Tracking Dashboard</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: sans-serif; background: #0f172a; }
        #map { width: 100%; height: 100%; }
        .hud {
            position: absolute;
            top: 15px;
            left: 55px;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.9);
            color: #ffffff;
            padding: 14px 20px;
            border-radius: 10px;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.15);
        }
        .hud h2 { margin: 0 0 6px 0; font-size: 16px; font-weight: 600; color: #38bdf8; display: flex; align-items: center; gap: 8px;}
        .hud p { margin: 4px 0; font-size: 13px; color: #cbd5e1; }
        .live-badge {
            width: 9px;
            height: 9px;
            background-color: #22c55e;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px #22c55e;
            animation: pulse 1.5px infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
    </style>
</head>
<body>
    <div class="hud">
        <h2><span class="live-badge"></span> Scooter Live Tracker</h2>
        <p><strong>Status:</strong> <span id="status-text" style="color: #22c55e;">Connected & Live</span></p>
        <p><strong>Last Seen:</strong> <span id="last-time">Loading...</span></p>
        <p><strong>Coordinates:</strong> <span id="coords">--</span></p>
        <p><strong>Total History Points:</strong> <span id="total-points">0</span></p>
    </div>

    <div id="map"></div>

    <script>
        // ম্যাপ ইনিশিয়ালাইজেশন
        const map = L.map('map').setView([23.817414, 90.535214], 16);

        // Google Hybrid Satellite Layer
        const googleSat = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
        }).addTo(map);

        // কাস্টম 3D Scooter Icon (Emoji / Styled Marker)
        const scooterIcon = L.divIcon({
            className: 'custom-scooter-marker',
            html: '<div style="font-size: 28px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6)); transform: rotate(-25deg);">🛵</div>',
            iconSize: [35, 35],
            iconAnchor: [17, 17]
        });

        let currentMarker = null;
        let polyline = null;
        let historyLayers = [];

        async function fetchAndUpdateMap() {
            try {
                // সরাসরি গিটহাব বা ভেরসেল থেকে লেটেস্ট হিস্ট্রি ফাইল ফেচ করা
                const response = await fetch('location_history.json?_=' + new Date().getTime());
                if (!response.ok) throw new Error("Failed to fetch location history");
                
                const historyData = await response.json();
                if (!historyData || historyData.length === 0) return;

                const lastPoint = historyData[historyData.length - 1];
                
                // HUD আপডেট
                document.getElementById('last-time').innerText = lastPoint.time;
                document.getElementById('coords').innerText = `${lastPoint.lat.toFixed(6)}, ${lastPoint.lon.toFixed(6)}`;
                document.getElementById('total-points').innerText = historyData.length;

                // পুরানো মার্কার ও লেয়ার রিমোভ করা
                if (currentMarker) map.removeLayer(currentMarker);
                historyLayers.forEach(layer => map.removeLayer(layer));
                historyLayers = [];

                const latlngs = [];

                historyData.forEach((point, index) => {
                    const pos = [point.lat, point.lon];
                    latlngs.push(pos);

                    if (index === historyData.length - 1) {
                        // বর্তমান লেটেস্ট লোকেশনে 3D স্কুটার আইকন
                        currentMarker = L.marker(pos, { icon: scooterIcon }).addTo(map)
                            .bindPopup(`<b>Scooter Live Location</b><br>Time: ${point.time}`);
                        
                        // প্রথম লোডে সেন্টারিং
                        if (index === 0 || window.isFirstLoad !== false) {
                            map.setView(pos, 17);
                            window.isFirstLoad = false;
                        }
                    } else {
                        // আগের হিস্ট্রি পয়েন্টগুলো ছোট ডট হিসেবে থাকবে
                        const dot = L.circleMarker(pos, {
                            radius: 4,
                            color: '#38bdf8',
                            fillColor: '#38bdf8',
                            fillOpacity: 0.8
                        }).addTo(map).bindPopup(`History: ${point.time}`);
                        historyLayers.push(dot);
                    }
                });

                // ট্রাভেল হিস্ট্রি রুট লাইন (Polyline)
                if (polyline) map.removeLayer(polyline);
                if (latlngs.length > 1) {
                    polyline = L.polyline(latlngs, {
                        color: '#38bdf8',
                        weight: 5,
                        opacity: 0.85,
                        smoothFactor: 1
                    }).addTo(map);
                }

                document.getElementById('status-text').style.color = '#22c55e';
                document.getElementById('status-text').innerText = 'Synced 🟢';

            } catch (error) {
                console.error("Error updating map:", error);
                document.getElementById('status-text').style.color = '#ef4444';
                document.getElementById('status-text').innerText = 'Syncing... (Retrying)';
            }
        }

        // প্রথমবার লোড হওয়া
        fetchAndUpdateMap();

        // প্রতি ৩০ সেকেন্ড পর পর ব্যাকগ্রাউন্ডে অটো-রিফ্রেশ (পেজ রিলোড ছাড়াই)
        setInterval(fetchAndUpdateMap, 30000);
    </script>
</body>
</html>
