name: Scooter FMD Cloud Daemon

on:
  schedule:
    # প্রতি ৫ মিনিট পরপর ক্লাউডে অটো রান করবে
    - cron: '*/1 * * * *'
  workflow_dispatch: # গিটহাব ড্যাশবোর্ড থেকে ম্যানুয়ালি রান করার বাটন

jobs:
  run-tracker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests cryptography protobuf

      - name: Inject Auth Tokens from GitHub Secrets
        run: |
          mkdir -p Auth/
          # গিটহাব সিক্রেট থেকে বেস৬৪ কোড ডিকোড করে আবার Auth ফোল্ডারে টোকেন ফাইল রি-ক্রিয়েট করবে
          echo "${{ secrets.FMD_AUTH_TOKEN }}" | base64 -d > Auth/secrets.json

      - name: Run Master Tracker Script
        run: |
          python auto_master.py

      - name: Commit and Push Changes to Vercel/GitHub
        run: |
          git config --global user.name "Scooter Cloud Bot"
          git config --global user.email "bot@tracker.local"
          git add public/
          # যদি নতুন কোনো লোকেশন বা ম্যাপ আপডেট না থাকে, তবে গিট কমিট স্কিপ করবে
          git diff --quiet && git diff --staged --quiet || (git commit -m "Cloud Daemon: Auto-updated live scooter location [skip ci]" && git push)